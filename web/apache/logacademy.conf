<VirtualHost *:80>
    ServerName logacademy.local
    DocumentRoot /var/www/html/logacademy

    <Directory /var/www/html/logacademy>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # backup/ directory listing intentionally enabled (Chain 1)
    <Directory /var/www/html/logacademy/backup>
        Options Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # uploads/ accessible directly (Chain 4)
    <Directory /var/www/html/logacademy/uploads>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        php_flag engine on
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/logacademy_error.log
    CustomLog ${APACHE_LOG_DIR}/logacademy_access.log combined
</VirtualHost>
