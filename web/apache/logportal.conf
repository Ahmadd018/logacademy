<VirtualHost *:80>
    ServerName logportal.local
    DocumentRoot /var/www/html/logportal

    <Directory /var/www/html/logportal>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/logportal_error.log
    CustomLog ${APACHE_LOG_DIR}/logportal_access.log combined
</VirtualHost>
